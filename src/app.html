<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- SEO defaults (overridden per-page via svelte:head) -->
		<meta name="description" content="Launchpad by Progeta Technologies — Own your learning. Assets, certifications, and mentoring for the modern learner." />
		<meta name="robots" content="index, follow" />
		
		<!-- Typography: Inter (Google Fonts) -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Launchpad" />
		<meta property="og:locale" content="en_IN" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />

		<!-- Anti-FOUC Theme Pre-initialization -->
		<script>
			try {
				var saved = localStorage.getItem('launchpad-theme') || 'system';
				var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (isDark) {
					document.documentElement.setAttribute('data-theme', 'dark');
					document.documentElement.classList.add('dark');
				} else {
					document.documentElement.setAttribute('data-theme', 'light');
					document.documentElement.classList.remove('dark');
				}
			} catch (_) {}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
