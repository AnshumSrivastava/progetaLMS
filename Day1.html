<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cybersecurity Foundations — Day 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#ffffff; --panel:#f2f2f0;
    --line:rgba(0,0,0,0.14); --line-strong:rgba(0,0,0,0.32);
    --ink:#111110; --ink-dim:#4a4946; --ink-faint:#8c8b87;
    --accent:#111110; --accent-dim:rgba(0,0,0,0.06);
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --sans:'IBM Plex Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); overflow:hidden; -webkit-font-smoothing:antialiased; }
  .grain{
    position:fixed; inset:0; pointer-events:none; z-index:1; opacity:0.15;
    background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(circle at 50% 40%, black, transparent 75%);
            mask-image:radial-gradient(circle at 50% 40%, black, transparent 75%);
  }

  .chrome-top{ position:fixed; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:18px 26px 0 26px; font-family:var(--mono); pointer-events:none; }
  .chrome-left, .chrome-right{ display:flex; align-items:center; gap:10px; pointer-events:auto; }
  .tag{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-dim); border:1px solid var(--line-strong); padding:5px 10px; border-radius:2px; background:rgba(0,0,0,0.03); }
  .tag b{ color:var(--ink); font-weight:600; }
  .progress-track{ position:fixed; top:0; left:0; right:0; height:2px; background:var(--line); z-index:21; }
  .progress-fill{ height:100%; background:var(--ink); width:0%; transition:width .5s cubic-bezier(.65,0,.35,1); }
  .icon-btn{ all:unset; cursor:pointer; color:var(--ink-dim); font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--line-strong); padding:6px 11px; border-radius:2px; display:flex; align-items:center; gap:6px; transition:.2s; background:rgba(0,0,0,0.03); }
  .icon-btn:hover{ color:var(--bg); background:var(--ink); border-color:var(--ink); }

  .deck{ position:relative; height:100vh; width:100vw; z-index:2; }
  .slide{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:100px 8vw 84px 8vw; opacity:0; visibility:hidden; transform:translateY(20px) scale(.99);
    transition:opacity .5s cubic-bezier(.22,.61,.36,1), transform .55s cubic-bezier(.22,.61,.36,1);
    text-align:left; overflow:hidden;
  }
  .slide.active{ opacity:1; visibility:visible; transform:translateY(0) scale(1); z-index:5; }
  .slide.prev{ transform:translateY(-14px) scale(.99); }
  .slide-inner{ max-width:980px; width:100%; margin:0 auto; }

  .eyebrow{ font-family:var(--mono); font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-dim); margin:0 0 16px 0; display:flex; align-items:center; gap:10px; }
  .eyebrow::before{ content:''; width:22px; height:1px; background:var(--ink-dim); display:inline-block; }

  h1.slide-title{ font-family:var(--mono); font-weight:600; font-size:clamp(26px,3.9vw,52px); line-height:1.1; letter-spacing:-.01em; margin:0 0 8px 0; color:var(--ink); }
  .slide-sub{ font-size:clamp(14px,1.4vw,19px); color:var(--ink-dim); font-weight:400; margin:12px 0 0 0; max-width:680px; line-height:1.6; }

  .reveal{ position:relative; display:inline-block; overflow:hidden; }
  .reveal > span{ display:inline-block; }
  .reveal::after{ content:''; position:absolute; inset:0; background:var(--ink); transform-origin:right; transform:scaleX(1); }
  .slide.active .reveal::after{ transition:transform .55s cubic-bezier(.65,0,.35,1); transition-delay:.15s; transform:scaleX(0); }

  .statement{ text-align:center; }
  .statement .slide-inner{ display:flex; flex-direction:column; align-items:center; }
  .statement h1.slide-title{ font-size:clamp(26px,4.8vw,50px); max-width:900px; }
  .statement .eyebrow{ justify-content:center; } .statement .eyebrow::before{ display:none; }

  .divider .big-num{ font-family:var(--mono); color:var(--ink); font-size:14px; letter-spacing:.2em; text-transform:uppercase; margin-bottom:20px; }
  .divider h1.slide-title{ font-size:clamp(34px,6.6vw,80px); }
  .divider .rule{ width:110px; height:2px; background:var(--ink); margin:24px 0; }

  ul.list{ list-style:none; margin:26px 0 0 0; padding:0; display:flex; flex-direction:column; }
  ul.list li{ font-size:clamp(15px,1.6vw,20px); padding:13px 0; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:16px; color:var(--ink); opacity:0; transform:translateX(-10px); }
  ul.list li:first-child{ border-top:1px solid var(--line); }
  ul.list li::before{ content:attr(data-idx); font-family:var(--mono); font-size:12px; color:var(--ink-faint); min-width:24px; }
  .slide.active ul.list li{ animation:sweepIn .5s cubic-bezier(.22,.61,.36,1) forwards; }
  .slide.active ul.list li:nth-child(1){animation-delay:.05s;} .slide.active ul.list li:nth-child(2){animation-delay:.10s;}
  .slide.active ul.list li:nth-child(3){animation-delay:.15s;} .slide.active ul.list li:nth-child(4){animation-delay:.20s;}
  .slide.active ul.list li:nth-child(5){animation-delay:.25s;} .slide.active ul.list li:nth-child(6){animation-delay:.30s;}
  @keyframes sweepIn{ to{ opacity:1; transform:translateX(0);} }
  @keyframes riseIn{ to{ opacity:1; transform:translateY(0);} }

  /* flow diagram */
  .flow{ display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:0; margin-top:38px; }
  .flow-node{ display:flex; flex-direction:column; align-items:center; gap:10px; width:150px; opacity:0; transform:translateY(10px); }
  .slide.active .flow-node{ animation:riseIn .45s cubic-bezier(.22,.61,.36,1) forwards; }
  .slide.active .flow-node:nth-child(1){animation-delay:.05s;} .slide.active .flow-node:nth-child(3){animation-delay:.2s;}
  .slide.active .flow-node:nth-child(5){animation-delay:.35s;} .slide.active .flow-node:nth-child(7){animation-delay:.5s;} .slide.active .flow-node:nth-child(9){animation-delay:.65s;}
  .flow-circle{ width:62px; height:62px; border-radius:50%; border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:12px; color:var(--ink); }
  .flow-name{ font-size:13px; color:var(--ink-dim); font-family:var(--mono); text-transform:uppercase; letter-spacing:.05em; text-align:center; }
  .flow-arrow{ color:var(--ink-faint); font-size:22px; width:34px; text-align:center; align-self:flex-start; margin-top:18px; }
  @media(max-width:640px){ .flow{ flex-direction:column; } .flow-arrow{ align-self:center; margin-top:0; transform:rotate(90deg); } }

  /* grid diagram */
  .grid-diagram{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:32px; }
  @media(max-width:640px){ .grid-diagram{ grid-template-columns:1fr 1fr; } }
  .grid-tile{ border:1px solid var(--line-strong); border-radius:6px; padding:22px 16px; font-family:var(--mono); font-size:clamp(13px,1.4vw,16px); color:var(--ink); text-align:center; opacity:0; transform:translateY(8px); }
  .slide.active .grid-tile{ animation:riseIn .45s cubic-bezier(.22,.61,.36,1) forwards; }
  .slide.active .grid-tile:nth-child(1){animation-delay:.04s;} .slide.active .grid-tile:nth-child(2){animation-delay:.09s;} .slide.active .grid-tile:nth-child(3){animation-delay:.14s;}
  .slide.active .grid-tile:nth-child(4){animation-delay:.19s;} .slide.active .grid-tile:nth-child(5){animation-delay:.24s;} .slide.active .grid-tile:nth-child(6){animation-delay:.29s;} .slide.active .grid-tile:nth-child(7){animation-delay:.34s;}

  /* triad */
  .triad-diagram{ position:relative; width:min(420px,80vw); aspect-ratio:1/0.92; margin:30px auto 0; }
  .triad-diagram svg{ width:100%; height:100%; }
  .triad-label{ position:absolute; transform:translate(-50%,-50%); text-align:center; font-family:var(--mono); opacity:0; transition:.5s cubic-bezier(.22,.61,.36,1); }
  .slide.active .triad-label{ opacity:1; }
  .triad-label .tn{ font-size:clamp(13px,1.6vw,17px); color:var(--ink); font-weight:600; }

  /* label-story */
  .label-story .slide-inner{ text-align:center; }
  .label-story .pillar{ font-family:var(--mono); font-size:clamp(13px,1.6vw,17px); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:18px; }

  /* compare */
  .compare{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:34px; max-width:760px; }
  @media(max-width:700px){ .compare{ grid-template-columns:1fr; } }
  .cmp-card{ border:1px solid var(--line-strong); border-radius:8px; padding:28px 24px; opacity:0; transform:translateY(10px); }
  .slide.active .cmp-card{ animation:riseIn .5s cubic-bezier(.22,.61,.36,1) forwards; }
  .slide.active .cmp-card:nth-child(1){ animation-delay:.05s; } .slide.active .cmp-card:nth-child(2){ animation-delay:.16s; }
  .cmp-card.invert{ background:var(--ink); color:var(--bg); }
  .cmp-card .clabel{ font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; opacity:.6; margin-bottom:10px; }
  .cmp-card .cval{ font-family:var(--mono); font-size:clamp(17px,2.1vw,25px); word-break:break-word; }

  /* code */
  .term{ margin-top:28px; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden; opacity:0; transform:translateY(10px) scale(.98); }
  .slide.active .term{ animation:riseIn2 .55s cubic-bezier(.22,.61,.36,1) .1s forwards; }
  @keyframes riseIn2{ to{opacity:1; transform:translateY(0) scale(1);} }
  .term-bar{ display:flex; align-items:center; gap:7px; padding:11px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  .term-dot{ width:9px; height:9px; border-radius:50%; border:1px solid var(--line-strong); }
  .term-body{ padding:22px 26px; font-family:var(--mono); font-size:clamp(14px,1.6vw,19px); line-height:2; }
  .term-line{ display:flex; gap:10px; }
  .term-prompt{ color:var(--ink); }
  .term-out{ color:var(--ink-dim); padding-left:26px; }
  .cursor{ display:inline-block; width:8px; height:1.1em; background:var(--ink); margin-left:4px; vertical-align:-2px; animation:blink 1s step-end infinite; }
  @keyframes blink{ 50%{opacity:0;} }

  /* tool links */
  .link-list{ margin-top:26px; display:flex; flex-direction:column; max-width:720px; width:100%; }
  .link-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:15px 0; border-bottom:1px solid var(--line); opacity:0; transform:translateX(-8px); }
  .link-list .link-row:first-child{ border-top:1px solid var(--line); }
  .slide.active .link-row{ animation:sweepIn .45s cubic-bezier(.22,.61,.36,1) forwards; }
  .slide.active .link-row:nth-child(1){animation-delay:.04s;} .slide.active .link-row:nth-child(2){animation-delay:.09s;}
  .slide.active .link-row:nth-child(3){animation-delay:.14s;} .slide.active .link-row:nth-child(4){animation-delay:.19s;}
  .slide.active .link-row:nth-child(5){animation-delay:.24s;} .slide.active .link-row:nth-child(6){animation-delay:.29s;} .slide.active .link-row:nth-child(7){animation-delay:.34s;}
  .link-row .lname{ font-weight:600; font-size:clamp(14px,1.5vw,17px); color:var(--ink); font-family:var(--mono); }
  .link-row .lnote{ font-size:12px; color:var(--ink-faint); margin-top:2px; }
  .single-link{ margin-top:26px; }
  .actions{ display:flex; gap:8px; flex:none; }
  .icon-btn-sm{ all:unset; cursor:pointer; font-family:var(--mono); font-size:11.5px; letter-spacing:.05em; padding:8px 13px; border:1px solid var(--line-strong); border-radius:5px; color:var(--ink-dim); display:inline-flex; align-items:center; gap:5px; transition:.15s; }
  .icon-btn-sm:hover{ color:var(--bg); background:var(--ink); border-color:var(--ink); }
  a.icon-btn-sm{ text-decoration:none; }

  /* level marker */
  .level-num{ font-family:var(--mono); font-size:clamp(70px,14vw,180px); font-weight:600; color:var(--ink); line-height:1; letter-spacing:-.02em; }

  /* checklist */
  ul.check{ list-style:none; margin:32px 0 0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:16px 40px; max-width:640px; }
  @media(max-width:640px){ ul.check{ grid-template-columns:1fr; } }
  ul.check li{ display:flex; align-items:center; gap:12px; font-size:clamp(15px,1.7vw,19px); opacity:0; transform:translateY(8px); }
  ul.check li::before{ content:'✓'; font-family:var(--mono); font-weight:700; width:26px; height:26px; border:1px solid var(--line-strong); border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:13px; flex:none; }
  .slide.active ul.check li{ animation:riseIn .5s cubic-bezier(.22,.61,.36,1) forwards; }
  .slide.active ul.check li:nth-child(1){animation-delay:.04s;} .slide.active ul.check li:nth-child(2){animation-delay:.09s;}
  .slide.active ul.check li:nth-child(3){animation-delay:.14s;} .slide.active ul.check li:nth-child(4){animation-delay:.19s;}
  .slide.active ul.check li:nth-child(5){animation-delay:.24s;} .slide.active ul.check li:nth-child(6){animation-delay:.29s;}
  .slide.active ul.check li:nth-child(7){animation-delay:.34s;} .slide.active ul.check li:nth-child(8){animation-delay:.39s;}
  .slide.active ul.check li:nth-child(9){animation-delay:.44s;} .slide.active ul.check li:nth-child(10){animation-delay:.49s;}

  /* live answers (slide 4) */
  .live-wrap{ width:100%; max-width:760px; margin-top:20px; }
  .live-input-row{ display:flex; gap:10px; }
  .live-input-row input{
    flex:1; background:transparent; border:1px solid var(--line-strong); border-radius:6px; color:var(--ink);
    font-family:var(--sans); font-size:16px; padding:14px 16px; outline:none; transition:.2s;
  }
  .live-input-row input::placeholder{ color:var(--ink-faint); }
  .live-input-row input:focus{ border-color:var(--ink); }
  .live-chips{ display:flex; flex-wrap:wrap; gap:10px; margin-top:26px; min-height:44px; }
  .live-chip{
    display:inline-flex; align-items:center; gap:10px; font-family:var(--mono); font-size:14px;
    padding:10px 10px 10px 16px; border:1px solid var(--line-strong); border-radius:22px; color:var(--ink);
    animation:riseIn .3s ease forwards; opacity:0; transform:translateY(6px);
  }
  .live-remove{ all:unset; cursor:pointer; width:20px; height:20px; border-radius:50%; border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--ink-dim); transition:.15s; }
  .live-remove:hover{ color:var(--bg); background:var(--ink); border-color:var(--ink); }
  .live-empty{ font-family:var(--mono); font-size:13px; color:var(--ink-faint); }
  .live-note{ font-family:var(--mono); font-size:11px; color:var(--ink-faint); margin-top:16px; }

  /* nav controls */
  .chrome-bottom{ position:fixed; bottom:0; left:0; right:0; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:0 26px 22px 26px; font-family:var(--mono); pointer-events:none; }
  .chrome-bottom > *{ pointer-events:auto; }
  .counter{ font-size:12px; color:var(--ink-dim); letter-spacing:.06em; }
  .counter b{ color:var(--ink); font-weight:600; }
  .nav-btns{ display:flex; gap:10px; }
  .nav-btn{ all:unset; cursor:pointer; width:42px; height:42px; border-radius:50%; border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center; color:var(--ink-dim); transition:.2s; background:rgba(0,0,0,0.03); }
  .nav-btn:hover{ color:var(--bg); background:var(--ink); border-color:var(--ink); }
  .nav-btn:disabled{ opacity:.3; pointer-events:none; }
  .clickzone{ position:fixed; top:0; bottom:0; width:14%; z-index:15; cursor:pointer; }
  .clickzone.left{ left:0; } .clickzone.right{ right:0; }

  .powered-by{
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:22;
    display:flex; align-items:center; gap:8px; pointer-events:none;
    font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint);
  }
  .powered-by img{ height:16px; width:auto; display:block; opacity:.85; }

  /* overview */
  .overview{ position:fixed; inset:0; background:rgba(255,255,255,0.97); z-index:50; display:flex; flex-direction:column; padding:70px 6vw 40px; opacity:0; visibility:hidden; transition:opacity .3s ease; }
  .overview.open{ opacity:1; visibility:visible; }
  .overview-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; }
  .overview-head h2{ font-family:var(--mono); font-size:14px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink); margin:0; }
  .overview-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; overflow-y:auto; padding-bottom:20px; }
  .ov-card{ border:1px solid var(--line-strong); border-radius:6px; padding:12px; cursor:pointer; transition:.2s; }
  .ov-card:hover{ border-color:var(--ink); background:var(--accent-dim); }
  .ov-card .ov-eyebrow{ font-family:var(--mono); font-size:9px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.1em; margin-bottom:5px; }
  .ov-card .ov-title{ font-size:12px; color:var(--ink); line-height:1.3; }
  .ov-card .ov-idx{ font-family:var(--mono); font-size:9px; color:var(--ink-faint); float:right; }

  /* qr modal */
  .qr-modal{ position:fixed; inset:0; background:rgba(255,255,255,0.90); z-index:60; display:flex; align-items:center; justify-content:center; opacity:0; visibility:hidden; transition:.25s; padding:20px; }
  .qr-modal.open{ opacity:1; visibility:visible; }
  .qr-card{ background:var(--panel); border:1px solid var(--line-strong); border-radius:12px; padding:30px; width:320px; text-align:center; transform:scale(.94); transition:.25s; }
  .qr-modal.open .qr-card{ transform:scale(1); }
  .qr-card .qlabel2{ font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink); margin-bottom:14px; }
  #qrCanvas{ display:flex; align-items:center; justify-content:center; background:#ffffff; border:1px solid var(--line-strong); border-radius:8px; padding:14px; margin:0 auto 16px; width:220px; height:220px; }
  .qr-url{ display:inline-block; font-family:var(--mono); font-weight:600; font-size:17px; color:var(--ink); text-decoration:underline; text-decoration-color:var(--line-strong); word-break:break-all; margin-bottom:20px; transition:.15s; }
  .qr-url:hover{ text-decoration-color:var(--ink); }
  .qr-close{ all:unset; cursor:pointer; font-family:var(--mono); font-size:12px; color:var(--ink-dim); border:1px solid var(--line-strong); padding:8px 16px; border-radius:5px; }
  .qr-close:hover{ color:var(--ink); border-color:var(--ink); }

  ::selection{ background:var(--ink); color:var(--bg); }

  @media(prefers-reduced-motion:reduce){
    .slide, ul.list li, .flow-node, .grid-tile, .cmp-card, .term, .link-row, ul.check li, .reveal::after, .live-chip{
      transition:none !important; animation:none !important; opacity:1 !important; transform:none !important;
    }
  }
  @media(max-width:640px){
    .slide{ padding:90px 6vw 78px 6vw; }
    .chrome-top{ padding:14px 16px 0; } .chrome-bottom{ padding:0 16px 16px; }
  }
</style>
</head>
<body>

<div class="grain"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

<div class="chrome-top">
  <div class="chrome-left"><span class="tag" id="sectionTag">Day 1 <b>·</b> Cybersecurity Foundations</span></div>
  <div class="chrome-right"><button class="icon-btn" id="overviewBtn" title="Overview (G)">⊞ Overview</button></div>
</div>

<div class="clickzone left" id="zoneLeft"></div>
<div class="clickzone right" id="zoneRight"></div>

<main class="deck" id="deck"></main>

<div class="chrome-bottom">
  <div class="counter"><b id="curNum">01</b> / <span id="totalNum">00</span></div>
  <div class="nav-btns">
    <button class="nav-btn" id="prevBtn" title="Previous (←)">←</button>
    <button class="nav-btn" id="nextBtn" title="Next (→)">→</button>
  </div>
</div>

const deck = document.getElementById('deck');

function revealTitle(text){ return `<span class="reveal"><span>${text}</span></span>`; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function linkActions(url, label){
  if(!url) return '';
  return `<div class="actions">
    <a class="icon-btn-sm" href="${url}" target="_blank" rel="noopener">Open ↗</a>
    <button class="icon-btn-sm qr-btn" data-url="${url}" data-label="${esc(label)}">QR</button>
  </div>`;
}

function renderSlide(s, i){
  const wrap = document.createElement('section');
  wrap.className = 'slide type-' + s.type;
  wrap.dataset.index = i;
  let inner = '';

  switch(s.type){
    case 'title':
      inner = `<div class="eyebrow">${s.eyebrow}</div><h1 class="slide-title">${revealTitle(s.title)}</h1><p class="slide-sub">${s.sub}</p>`;
      break;

    case 'divider':
      inner = `<div class="big-num">${s.num}</div><h1 class="slide-title">${revealTitle(s.title)}</h1><div class="rule"></div>`;
      wrap.classList.add('divider');
      break;

    case 'statement':
      inner = `${s.eyebrow?`<div class="eyebrow">${s.eyebrow}</div>`:''}<h1 class="slide-title">${revealTitle(s.title)}</h1>${s.sub?`<p class="slide-sub">${s.sub}</p>`:''}`;
      wrap.classList.add('statement');
      break;

    case 'flow':
      inner = `<div class="eyebrow">${s.eyebrow}</div><h1 class="slide-title">${revealTitle(s.title)}</h1>
        <div class="flow">${s.steps.map((st,idx)=>`
          <div class="flow-node"><div class="flow-circle">${String(idx+1).padStart(2,'0')}</div><div class="flow-name">${st}</div></div>
          ${idx<s.steps.length-1?'<div class="flow-arrow">→</div>':''}`).join('')}</div>
        ${s.quote?`<p class="slide-sub" style="margin-top:30px; font-style:italic;">${s.quote}</p>`:''}`;
      wrap.classList.add('statement');
      break;

    case 'grid':
      inner = `<div class="eyebrow">${s.eyebrow}</div><h1 class="slide-title">${revealTitle(s.title)}</h1>
        <div class="grid-diagram">${s.items.map(it=>`<div class="grid-tile">${it}</div>`).join('')}</div>`;
      wrap.classList.add('statement');
      break;

    case 'triad':
      inner = `<div class="eyebrow">The CIA Triad</div>
        <div class="triad-diagram">
          <svg viewBox="0 0 400 360"><polygon points="200,30 370,320 30,320" fill="none" stroke="rgba(0,0,0,0.28)" stroke-width="1.5"/></svg>
          <div class="triad-label" style="top:8%; left:50%;"><div class="tn">Confidentiality</div></div>
          <div class="triad-label" style="top:92%; left:6%; transform:translate(0,-50%);"><div class="tn">Integrity</div></div>
          <div class="triad-label" style="top:92%; left:94%; transform:translate(-100%,-50%);"><div class="tn">Availability</div></div>
        </div>`;
      wrap.classList.add('statement');
      break;

    case 'labelStory':
      inner = `<div class="pillar">${s.pillar}</div><h1 class="slide-title">${revealTitle(s.title)}</h1>`;
      wrap.classList.add('statement', 'label-story');
      break;

    case 'bullets':
      inner = `<div class="eyebrow">${s.eyebrow}</div><h1 class="slide-title">${revealTitle(s.title)}</h1>
        <ul class="list">${s.items.map((it,idx)=>`<li data-idx="${String(idx+1).padStart(2,'0')}">${it}</li>`).join('')}</ul>`;
      break;

    case 'compare':
      inner = `<div class="eyebrow">Compare</div><h1 class="slide-title">${revealTitle(s.title)}</h1>
        <div class="compare">
          <div class="cmp-card"><div class="clabel">${s.a.label}</div><div class="cval">${s.a.val}</div></div>
          <div class="cmp-card ${s.b.invert?'invert':''}"><div class="clabel">${s.b.label}</div><div class="cval">${s.b.val}</div></div>
        </div>`;
      wrap.classList.add('statement');
      break;

    case 'code':
      inner = `<div class="eyebrow">${s.eyebrow}</div><h1 class="slide-title">${revealTitle(s.title)}</h1>
        <div class="term"><div class="term-bar"><span class="term-dot"></span><span class="term-dot"></span><span class="term-dot"></span></div>
        <div class="term-body">${s.lines.map(l=>`<div class="term-line"><span class="term-prompt">${l.p}</span><span>${l.c}</span></div>`).join('')}</div></div>`;
      break;

    case 'codeTool':
      inner = `<div class="eyebrow">${s.eyebrow}</div><h1 class="slide-title">${revealTitle(s.title)}</h1>
        <div class="term"><div class="term-bar"><span class="term-dot"></span><span class="term-dot"></span><span class="term-dot"></span></div>
        <div class="term-body">${s.lines.map(l=>`<div class="term-line"><span class="term-prompt">${l.p}</span><span>${l.c}</span></div>`).join('')}
        <div class="term-out">${s.out}<span class="cursor"></span></div></div></div>
        ${s.tool?`<div class="link-row" style="max-width:520px; border-top:none; border-bottom:none; padding-top:18px;"><div><div class="lname">${s.tool.name}</div></div>${linkActions(s.tool.url, s.tool.name)}</div>`:''}`;
      break;

    case 'toolLinks':
      inner = `<div class="eyebrow">${s.eyebrow}</div><h1 class="slide-title">${revealTitle(s.title)}</h1>
        <div class="link-list">${s.items.map(t=>`<div class="link-row"><div><div class="lname">${t.name}</div>${t.desc?`<div class="lnote">${t.desc}</div>`:''}</div>${linkActions(t.url, t.name)}</div>`).join('')}</div>`;
      break;

    case 'singleTool':
      inner = `${s.eyebrow?`<div class="eyebrow">${s.eyebrow}</div>`:''}<h1 class="slide-title">${revealTitle(s.title)}</h1>${s.sub?`<p class="slide-sub">${s.sub}</p>`:''}
        <div class="single-link"><div class="link-row" style="border-top:1px solid var(--line); max-width:520px;"><div class="lname">${s.tool.name}</div>${linkActions(s.tool.url, s.tool.name)}</div></div>`;
      wrap.classList.add('statement');
      break;

    case 'incidents':
      inner = `<div class="eyebrow">${s.eyebrow}</div><h1 class="slide-title">${revealTitle(s.title)}</h1>
        <div class="link-list">${s.items.map(it=>`
          <div class="link-row" style="align-items:flex-start;">
            <div style="max-width:600px;"><div class="lname">${it.label}</div><div class="lnote" style="margin-top:6px; font-family:var(--sans); font-size:14px; color:var(--ink-dim);">${it.example}</div></div>
          </div>`).join('')}</div>`;
      break;

    case 'level':
      inner = `<div class="level-num">${revealTitle(s.label)}</div>`;
      wrap.classList.add('statement');
      break;

    case 'checklist':
      inner = `<div class="eyebrow">${s.eyebrow}</div><h1 class="slide-title">${revealTitle(s.title)}</h1>
        <ul class="check">${s.items.map(it=>`<li>${it}</li>`).join('')}</ul>`;
      wrap.classList.add('statement');
      break;

    case 'liveAnswers':
      inner = `${s.eyebrow?`<div class="eyebrow">${s.eyebrow}</div>`:''}<h1 class="slide-title">${revealTitle(s.title)}</h1>${s.sub?`<p class="slide-sub">${s.sub}</p>`:''}
        <div class="live-wrap" data-storage="day1_live_${s.id||'default'}">
          ${s.items?`<div class="chip-row" style="margin-top:22px; margin-bottom:6px;">${s.items.map(c=>`<span class="chip" style="opacity:.65; font-size:12px; padding:7px 14px;">${c}</span>`).join('')}</div>`:''}
          <div class="live-input-row">
            <input type="text" class="liveInput" placeholder="${s.placeholder||'Type an answer, press Enter'}" autocomplete="off">
            <button class="icon-btn-sm liveClear">Clear all</button>
          </div>
          <div class="live-chips"></div>
          <div class="live-note">Saved on this device — visible next time you open this deck here.</div>
        </div>`;
      wrap.classList.add('statement');
      break;
  }

  wrap.innerHTML = `<div class="slide-inner">${inner}</div>`;
  return wrap;
}

SLIDES.forEach((s,i)=> deck.appendChild(renderSlide(s,i)));
document.getElementById('totalNum').textContent = String(total).padStart(2,'0');

/* ---------- live answers logic (supports multiple instances) ---------- */
document.querySelectorAll('.live-wrap').forEach((wrap)=>{
  const STORAGE_KEY = wrap.dataset.storage || 'day1_live_default';
  const input = wrap.querySelector('.liveInput');
  const chipsEl = wrap.querySelector('.live-chips');
  const clearBtn = wrap.querySelector('.liveClear');
  if(!input) return;

  function load(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }catch(e){ return []; } }
  function save(arr){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }catch(e){} }
  function render(){
    const arr = load();
    chipsEl.innerHTML = arr.length
      ? arr.map((a,i)=>`<span class="live-chip">${esc(a)}<button class="live-remove" data-i="${i}" title="Remove">×</button></span>`).join('')
      : `<span class="live-empty">No answers yet — waiting for the room.</span>`;
  }
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && input.value.trim()){
      const arr = load(); arr.push(input.value.trim()); save(arr);
      input.value=''; render();
    }
  });
  chipsEl.addEventListener('click', (e)=>{
    const btn = e.target.closest('.live-remove');
    if(!btn) return;
    const arr = load(); arr.splice(Number(btn.dataset.i),1); save(arr); render();
  });
  clearBtn.addEventListener('click', ()=>{ save([]); render(); });
  render();
});

/* ============================================================
   NAV STATE
   ============================================================ */
let idx = 0;
const slideEls = Array.from(document.querySelectorAll('.slide'));
const progressFill = document.getElementById('progressFill');
const curNum = document.getElementById('curNum');
const sectionTag = document.getElementById('sectionTag');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function currentSectionLabel(i){
  for(let k=i;k>=0;k--){ if(SLIDES[k].type==='divider') return SLIDES[k].title; }
  return 'Act 1 · Why Does Cybersecurity Exist?';
}

function goTo(n){
  n = Math.max(0, Math.min(total-1, n));
  slideEls[idx].classList.remove('active'); slideEls[idx].classList.add('prev');
  idx = n;
  slideEls.forEach((el,i)=> el.classList.toggle('prev', i<idx));
  slideEls[idx].classList.add('active'); slideEls[idx].classList.remove('prev');
  progressFill.style.width = ((idx)/(total-1)*100)+'%';
  curNum.textContent = String(idx+1).padStart(2,'0');
  sectionTag.innerHTML = `${currentSectionLabel(idx)} <b>·</b> Day 1`;
  prevBtn.disabled = idx===0; nextBtn.disabled = idx===total-1;
  if(SLIDES[idx].type==='liveAnswers'){ const inp=slideEls[idx].querySelector('.liveInput'); if(inp) setTimeout(()=>inp.focus(), 400); }
}

slideEls[0].classList.add('active');
goTo(0);

document.getElementById('zoneRight').addEventListener('click', ()=>goTo(idx+1));
document.getElementById('zoneLeft').addEventListener('click', ()=>goTo(idx-1));
nextBtn.addEventListener('click', ()=>goTo(idx+1));
prevBtn.addEventListener('click', ()=>goTo(idx-1));

document.addEventListener('keydown', (e)=>{
  const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
  if(overview.classList.contains('open')){ if(e.key==='Escape') closeOv(); return; }
  if(qrModal.classList.contains('open')){ if(e.key==='Escape') qrModal.classList.remove('open'); return; }
  if(typing){ if(e.key==='Escape') document.activeElement.blur(); return; }
  if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); goTo(idx+1); }
  if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); goTo(idx-1); }
  if(e.key==='Home') goTo(0);
  if(e.key==='End') goTo(total-1);
  if(e.key==='g' || e.key==='G') openOv();
});

let touchX = null;
document.addEventListener('touchstart', e=> touchX = e.touches[0].clientX);
document.addEventListener('touchend', e=>{
  if(touchX===null) return;
  if(document.activeElement && document.activeElement.tagName==='INPUT') { touchX=null; return; }
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx) > 50) goTo(dx<0 ? idx+1 : idx-1);
  touchX = null;
});

/* overview */
const overview = document.getElementById('overview');
const overviewGrid = document.getElementById('overviewGrid');
SLIDES.forEach((s,i)=>{
  const card = document.createElement('div');
  card.className = 'ov-card';
  const label = s.title || s.label || s.eyebrow || s.type;
  card.innerHTML = `<span class="ov-idx">${String(i+1).padStart(2,'0')}</span><div class="ov-eyebrow">${s.eyebrow || s.num || s.type}</div><div class="ov-title">${label}</div>`;
  card.addEventListener('click', ()=>{ goTo(i); closeOv(); });
  overviewGrid.appendChild(card);
});
function openOv(){ overview.classList.add('open'); }
function closeOv(){ overview.classList.remove('open'); }
document.getElementById('overviewBtn').addEventListener('click', openOv);
document.getElementById('closeOverview').addEventListener('click', closeOv);

/* QR modal */
const qrModal = document.getElementById('qrModal');
const qrCanvas = document.getElementById('qrCanvas');
const qrUrl = document.getElementById('qrUrl');
const qrLabel = document.getElementById('qrLabel');
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.qr-btn');
  if(!btn) return;
  const url = btn.dataset.url;
  qrCanvas.innerHTML = '';
  qrLabel.textContent = btn.dataset.label || 'Scan to open';
  qrUrl.textContent = url;
  qrUrl.href = url;
  try{ new QRCode(qrCanvas, {text:url, width:190, height:190, colorDark:'#000000', colorLight:'#ffffff'}); }
  catch(err){ qrCanvas.textContent = 'QR unavailable — use Open instead.'; }
  qrModal.classList.add('open');
});
document.getElementById('qrClose').addEventListener('click', ()=> qrModal.classList.remove('open'));
qrModal.addEventListener('click', (e)=>{ if(e.target===qrModal) qrModal.classList.remove('open'); });
</script>
